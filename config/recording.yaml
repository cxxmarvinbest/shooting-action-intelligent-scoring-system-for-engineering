# recording.yaml —— 实时录制配置
#
# N1 重构：视频分片（5 分钟 rotate）+ raw/ai 双 writer 命名规则由
# common/save_data_layout.py 集中维护；本文件只保留「分片周期 / 输出分辨率」
# 等运行时参数。

# 每 N 秒自动保存一段视频（rotate：写完当前段、开新文件）。
# 运动未跑满 N 秒、收到停止运动指令，立刻把当前片段落盘。
RECORD_ROTATE_SEC: 300

# 单个视频分片内 raw 视频与 ai 视频是否都开启。
#   RAW_CLIP: true  始终写原始视频（用于事后复核）
#   AI_CLIP:  true  同步写带 player 检测框 + 17 点 COCO 骨架的渲染视频
# 关闭 ai 可省一半磁盘 + 一半编码耗时，但 QT 端将无法直接播放 AI 渲染版。
RECORD_RAW_CLIP: true
RECORD_AI_CLIP: true

# ai 视频的渲染参数
RECORD_AI_JPEG_QUALITY: 90      # 渲染时中间帧 JPEG 编码质量

# ── N5 改造：视频编码器配置（subprocess ffmpeg + libx264 软件编码）─────
# 语义说明：FFMPEG_CODEC 是「ffmpeg 编码器名」，不再是 OpenCV 的 FourCC 码。
# 实现路径：common/ffmpeg_writer.py 用 subprocess 调 ffmpeg，显式传 -c:v。
#   为什么不用 cv2.VideoWriter：RK3588 上 fourcc='avc1' 会命中硬件编码器
#   h264_v4l2m2m 且失败后不 fallback 到 libx264，导致 VideoWriter 初始化失败。
#
# 编码器：libx264（纯软件 H.264，绕开硬件编码器，浏览器/手机兼容性最好）
# 码率控制：ABR 平均码率 + maxrate/bufsize 锁峰值上限
#   - 600k 码率下 5min 理论约 22MB（投篮场景静态画面多，实际会明显更小）
FFMPEG_CODEC: 'libx264'
FFMPEG_BITRATE: '600k'          # 平均码率（原 5000+kb/s）
FFMPEG_MAXRATE: '600k'          # 峰值码率上限（与平均码率持平，锁定上限）
FFMPEG_BUF_SIZE: '1200k'        # VBV 缓冲大小（通常 2x 码率）
FFMPEG_PRESET: 'veryfast'       # libx264 预设（速度/画质权衡）
FFMPEG_THREADS: 0               # 编码线程数（0=自动，离线渲染场景可设 1）

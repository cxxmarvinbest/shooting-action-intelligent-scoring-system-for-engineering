# model.yaml —— 模型路径与推理引擎/硬件调度
# ============================================================
# 仅存模型身份 + 硬件/引擎选择；推理阈值已外放到 det.yaml / pose.yaml。

# 检测模型（两类别：0=player 球员，1=basketball 篮球；FP16，静态输入 640x640）
DET_RKNN_PATH: "weights/best_int8.rknn"
# 姿态模型（yolov8-pose，17 关键点；INT8，静态输入）
# 注：转换工具要求宽高相同，故导出为 320x320；player 裁剪图以「保持宽高比 + 黑边」letterbox 送入。
POSE_RKNN_PATH: "weights/yolov8n_pose_int8_320.rknn"

# RK3588 NPU 核心调度模式（默认三核全开，提升检测+姿态并行吞吐）
# 按位掩码：0=AUTO, 1=CORE0, 2=CORE1, 4=CORE2, 3=CORE0_1, 7=CORE0_1_2
# 也兼容字符串写法：auto / 0 / 1 / 2 / 0_1 / 0_1_2
NPU_CORE_MASK: 7

# 检测推理引擎：rknn_lite（Python numpy 后处理） | cpp（C++ 后处理，性能优）
# 已通过 test/ab_cpp_engine.py A/B 验证（player/ball 召回 100%，IoU 0.988/1.000，
# 单帧 18.49ms vs lite 35.33ms），统一切 cpp。
# 注意：cpp 引擎的检测阈值由 C++ 硬编码 0.25（BOX_THRESH），无法对篮球单独放宽，
#       已 A/B 确认篮球召回 100% 可接受；若后续误检/漏检回退，可临时切回 rknn_lite。
DET_ENGINE: "cpp"

# pose.yaml —— 姿态模型（yolov8-pose，17 关键点）推理阈值
# ============================================================
# 作用域：把姿态模型原始输出过滤为「干净的人体框 + 关键点」（单帧、模型输出级）。
# 边界：投篮业务动作阈值（膝角/腕高/球腕距离等）在 fsm.yaml，禁止混入本文件。
#       NMS 阈值与检测（det.yaml）相互独立，禁止复用 DET_NMS_THRES。

# 姿态人体框置信度阈值（作用于 person 类置信度）
POSE_CONF_THRES: 0.3
# 姿态关键点置信度阈值（低置信关键点坐标置 0；INT8 量化下可适当放宽以改善丢点）
POSE_KPT_CONF_THRES: 0.3
# 姿态 NMS IoU 阈值（与检测 NMS 独立）
POSE_NMS_THRES: 0.45
# 姿态 crop 扩边 margin（像素）：player 框每边向外扩的像素数，防止关键点贴框边被切掉
POSE_CROP_MARGIN: 10
# 姿态模型固定输入尺寸（宽 x 高，均为 32 的整数倍；按实际 rknn 文件导出尺寸填写）
POSE_MODEL_W: 320
POSE_MODEL_H: 320

# compensate.yaml —— N3 姿态关键点局部补偿算法
# ---------------------------------------------------------------
# 三帧窗口 [i-1, i, i+1] 线性插值，补偿姿态估计产生的单帧孤立跳变/消失关键点。
# 仅做局部单帧补偿，大幅度真实人体动作不触发补偿。
#
# 总开关默认 false（生产安全）；调参/排障时置 true。
# 也可用环境变量 LQ_COMPENSATE=1 临时开启，无需改文件。

# 补偿总开关（false = 返回原始 kpts 副本，开销 ≈ copy）
COMPENSATE_ENABLED: true

# ── 阈值参数（像素 / 置信度）──

# 邻居稳定性阈值（像素）：i-1 与 i+1 同一点欧氏距离 < 此值视为"稳定"
# 值越小越保守（仅补偿微小抖动），值越大可能误补偿小幅动作
COMPENSATE_DIST_THRESHOLD: 30.0

# 跳变检测阈值（像素）：当前帧该点相对邻居中点的距离 > 此值视为"异常跳变"
# 应显著大于 DIST_THRESHOLD（正常抖动不应触发），小于典型肢体移动幅度
COMPENSATE_JUMP_THRESHOLD: 80.0

# 低置信度阈值：conf < 此值视为"不可靠"（触发补偿候选）
COMPENSATE_CONF_LOW: 0.3

# 高置信度阈值：conf >= 此值视为"可靠"邻居（i-1 和 i+1 都必须满足）
COMPENSATE_CONF_HIGH: 0.5

# 详细日志开关（true = 每帧打印被补偿的关节点索引；调试用，生产建议 false）
COMPENSATE_LOG_DETAIL: false

# inference.yaml —— 推理与预处理参数
# 目标尺寸：与标准视频一致（宽 x 高）
TARGET_W: 544
TARGET_H: 960

# 描灰边裁剪窗口横向中心偏移（像素，相对画面中心，正值向右）
CROP_X_OFFSET: 0

# 篮球过滤参数
BALL_MAX_ASPECT: 2        # 篮球框最大长宽比
BALL_MAX_W_RATIO: 0.4       # 篮球框最大宽度（相对画面宽度）

# 采样步长（1 = 每帧采样，实时性最高；2/3 = 隔帧采样降负载）
FRAME_STRIDE: 1

# 可视化输出
OUT_VIDEO_W: 480            # 分段展示视频宽
OUT_VIDEO_H: 640            # 分段展示视频高
OUT_SLOW_FACTOR: 0.4        # 慢放倍率
